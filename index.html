<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI CLI Token 用量</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='10' y='3' fill='%232b6cf6' rx='2'/%3E%3Crect width='4' height='7' y='6' x='2' fill='%233ecf8e' rx='1'/%3E%3Crect width='4' height='9' y='4' x='7' fill='%23f7b84f' rx='1'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme:dark;
    --bg:#10141d; --panel:#1a2030; --panel2:#151b28; --border:#2a3350; --text:#e2e8f5;
    --muted:#8b96b3; --accent:#2b6cf6; --accent2:#3b82f6;
    --tint:rgba(43,108,246,.18); --tintsoft:rgba(43,108,246,.12);
    --grid:#2a3350; --stub:#3a4360; --nodatarow:#4a5470; --dim:#3d4660; --future:#2e3650;
    --warn:#f7b84f; --shadow:rgba(0,0,0,.5); --tipbg:rgba(12,16,26,.97);
    --hover:rgba(226,232,245,.11); --barstroke:rgba(0,0,0,.32);
  }
  html[data-theme=light] {
    color-scheme:light;
    --bg:#f2f4fa; --panel:#fff; --panel2:#e9edf7; --border:#d2d9e8; --text:#1a2237;
    --muted:#5b6785; --accent:#2b6cf6; --accent2:#1c5cd0;
    --tint:rgba(43,108,246,.13); --tintsoft:rgba(43,108,246,.09);
    --grid:#dfe4f0; --stub:#c2cbe0; --nodatarow:#98a3bd; --dim:#a9b3c9; --future:#c6cddd;
    --warn:#a25b06; --shadow:rgba(30,44,80,.16); --tipbg:rgba(255,255,255,.98);
    --hover:rgba(43,108,246,.08); --barstroke:rgba(255,255,255,.9);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
         transition:background-color .18s ease, color .18s ease; }
  .topbar { display:flex; align-items:center; gap:14px; padding:14px 24px;
            background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap;
            position:sticky; top:0; z-index:20; }
  .tabs { display:flex; background:var(--panel2); border:1px solid var(--border);
          border-radius:10px; padding:3px; gap:2px; flex-wrap:wrap; }
  .tabs button { border:none; background:transparent; color:var(--muted); padding:6px 14px;
                 border-radius:8px; cursor:pointer; font-size:13px; }
  .tabs button.active { background:var(--tint); color:var(--accent2); }
  .tabs button:hover:not(.active) { color:var(--text); }
  .ctrl { display:flex; align-items:center; gap:8px; }
  .iconbtn { background:var(--panel2); border:1px solid var(--border); color:var(--muted);
             border-radius:10px; padding:7px 12px; cursor:pointer; font-size:13px;
             display:flex; align-items:center; gap:6px; }
  .iconbtn:hover { color:var(--text); }
  .rangebtn { background:var(--accent); border:none; color:#fff; border-radius:10px;
              padding:8px 16px; cursor:pointer; font-size:13px; display:flex; align-items:center; gap:8px; }
  .rangebtn:hover { filter:brightness(1.1); }
  .gran { display:flex; background:var(--panel2); border:1px solid var(--border);
          border-radius:10px; padding:3px; gap:2px; }
  .gran button { border:none; background:transparent; color:var(--muted); padding:5px 12px;
                 border-radius:7px; cursor:pointer; font-size:12px; }
  .gran button.active { background:var(--tint); color:var(--accent2); }
  #status { color:var(--warn); font-size:12px; }
  main { padding:18px 24px 40px; max-width:1400px; margin:0 auto; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin:0 0 20px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 18px; }
  .card .k { color:var(--muted); font-size:12px; }
  .card .v { font-size:24px; font-weight:600; margin-top:4px; }
  .card .s { color:var(--muted); font-size:12px; margin-top:2px; }
  section { background:var(--panel); border:1px solid var(--border); border-radius:12px;
            padding:18px; margin-bottom:20px; }
  section h2 { margin:0 0 12px; font-size:15px; display:flex; justify-content:space-between; align-items:baseline; }
  .legend { display:flex; gap:16px; color:var(--muted); font-size:12px; margin-bottom:8px; flex-wrap:wrap; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .tag { font-size:10px; border:1px solid var(--border); border-radius:4px; padding:0 4px; margin-left:4px; }
  svg { width:100%; height:auto; display:block; }
  svg text { fill:var(--muted); font-size:10px; }
  svg .grid { stroke:var(--grid); stroke-width:1; }
  svg .stub { stroke:var(--stub); stroke-width:2; }
  svg .seg  { stroke:var(--barstroke); stroke-width:.6; }
  /* full-height transparent band per column: the hover target, so a short bar is still
     easy to hit and the whole day's breakdown shows at once */
  svg .hit  { fill:transparent; cursor:crosshair; }
  svg .hit.on { fill:var(--hover); }
  section, .card { transition:background-color .18s ease, border-color .18s ease; }
  .tip { position:fixed; z-index:60; pointer-events:none; min-width:210px; max-width:320px;
         background:var(--tipbg); border:1px solid var(--accent2); border-radius:11px;
         padding:9px 11px; font-size:12px; box-shadow:0 10px 30px var(--shadow); }
  .tip[hidden] { display:none; }
  .tip .h { font-weight:700; font-size:13px; padding-bottom:5px; margin-bottom:6px;
            border-bottom:1px solid var(--border); }
  .tip .r { display:flex; align-items:center; gap:6px; line-height:1.75; }
  .tip .r .n { flex:1; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tip .r .q { font-weight:600; font-variant-numeric:tabular-nums; }
  .tip .s { margin-top:6px; padding-top:5px; border-top:1px solid var(--border);
            display:flex; justify-content:space-between; gap:12px; font-weight:700;
            font-variant-numeric:tabular-nums; }
  .tip .e { color:var(--muted); }
  /* the series palette is tuned for dark panels; lime/teal numbers wash out on white */
  html[data-theme=light] .card .v { filter:brightness(.72) saturate(1.4); }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th,td { padding:6px 10px; text-align:right; border-bottom:1px solid var(--border); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--muted); font-weight:600; }
  tr.nodata td { color:var(--nodatarow); }
  .muted { color:var(--muted); }
  /* the footnote is one bullet per source, not a run-on paragraph */
  .fn ul { margin:0; padding-left:18px; }
  .fn li { margin:3px 0; }
  /* fixed, not absolute: the topbar is sticky, so a document-relative popover would
     scroll away from the button it belongs to. placePicker() sets top/left. */
  .picker { position:fixed; z-index:50; background:var(--panel);
            border:1px solid var(--border); border-radius:14px; padding:16px;
            box-shadow:0 12px 40px var(--shadow); width:620px; max-width:calc(100vw - 24px); }
  .picker[hidden] { display:none; }
  .presets { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .presets button { background:var(--panel2); border:1px solid var(--border); color:var(--text);
                    border-radius:8px; padding:5px 14px; cursor:pointer; font-size:12px; }
  .presets button.active { border-color:var(--accent2); color:var(--accent2); }
  .presets button:hover { border-color:var(--accent2); }
  .pickerbody { display:grid; grid-template-columns:1fr 1.2fr; gap:16px; }
  .fields { display:flex; flex-direction:column; gap:12px; }
  .field label { display:block; color:var(--muted); font-size:12px; margin-bottom:5px; }
  .field input { width:100%; background:var(--panel2); border:1px solid var(--border);
                 border-radius:8px; padding:8px 10px; color:var(--text); font-size:14px; }
  .field input:focus { outline:none; border-color:var(--accent2); }
  .pactions { display:flex; justify-content:flex-end; gap:10px; margin-top:auto; }
  .pactions button { border-radius:8px; padding:7px 18px; cursor:pointer; font-size:13px; }
  #cancelBtn { background:transparent; border:1px solid var(--border); color:var(--muted); }
  #okBtn { background:var(--accent); border:none; color:#fff; }
  .calhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .calhead button { background:transparent; border:none; color:var(--muted); font-size:16px; cursor:pointer; padding:2px 10px; }
  .calhead span { font-size:14px; }
  .cal { background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:12px; }
  .calgrid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .calgrid .dow { text-align:center; color:var(--muted); font-size:11px; padding:4px 0; }
  .calday { text-align:center; padding:6px 0; font-size:12px; border-radius:6px; cursor:pointer; color:var(--text); }
  .calday.dim { color:var(--dim); }
  .calday:hover:not(.dim):not(.future) { background:var(--tint); }
  .calday.sel { background:var(--accent); color:#fff; }
  .calday.inrange { background:var(--tintsoft); color:var(--text); }
  .calday.future { color:var(--future); cursor:default; }
</style>
<script>
// Runs before first paint: a light-preference visitor would otherwise see a dark flash.
(function(){
  try {
    var t = localStorage.getItem('au-theme');
    if (t !== 'light' && t !== 'dark')
      t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
})();
</script>
</head>
<body>

<div class="topbar">
  <div class="tabs" id="tabs"></div>
  <div class="ctrl">
    <button class="iconbtn" id="refreshBtn" title="立即刷新">⟳ 刷新</button>
    <button class="iconbtn" id="autoBtn" title="切换自动刷新">⏱ <span id="autoLabel">30s</span></button>
    <button class="iconbtn" id="themeBtn" title="切换亮色/暗色">☀ 亮色</button>
  </div>
  <span class="gran" id="dim">
    <button data-d="src" class="active">按来源</button>
    <button data-d="model">按模型</button>
  </span>
  <button class="rangebtn" id="rangeBtn">📅 <span id="rangeLabel">…</span></button>
  <span id="status"></span>
</div>
<div class="picker" id="picker" hidden>
  <div class="presets" id="presets"></div>
  <div class="pickerbody">
    <div class="fields">
      <div class="field"><label>开始时间</label><input type="date" id="startIn"></div>
      <div class="field"><label>结束时间</label><input type="date" id="endIn"></div>
      <div class="pactions">
        <button id="cancelBtn">取消</button>

      </div>
    </div>
    <div>
      <div class="calhead">
        <button id="prevM">‹</button><span id="calTitle"></span><button id="nextM">›</button>
      </div>
      <div class="cal">
        <div class="calgrid" id="calDow"></div>
        <div class="calgrid" id="calBody"></div>
      </div>
    </div>
  </div>
</div>
<main>
  <div class="cards" id="cards"></div>
  <section>
    <h2><span id="chartTitle">输入 token</span>
      <span class="gran" id="gran">

        <button data-g="day" class="active">按天</button>
        <button data-g="week">按周</button>
        <button data-g="month">按月</button>
      </span>
    </h2>
    <div class="legend" id="legend"></div>
    <div id="chart"></div>
  </section>
  <section>
    <h2>明细</h2>
    <div style="overflow-x:auto"><table id="tbl"></table></div>
  </section>
  <div class="muted fn" style="font-size:12px" id="footnote"></div>
</main>
<div class="tip" id="tip" hidden></div>
<script>

const COLOR_HEX = {
  intl:'#4f8ef7', cn:'#3ecf8e', cc:'#f7b84f',
  'ccs-claude':'#f28e3c', 'ccs-codex':'#b48ef7', 'ccs-gemini':'#5cc8e8', 'ccs-opencode':'#e85c8a',
  'codebuddy':'#d4e157', 'workbuddy':'#4ec9b0', 'cline':'#7986cb', 'cline-vsc':'#9fa8da', 'reasonix':'#a1887f',
  'zcode':'#e5484d', 'qoder-ide':'#8fa1b3'
};
const PALETTE = ['#4f8ef7','#3ecf8e','#f7b84f','#b48ef7','#e85c8a','#5cc8e8','#9fef4f','#ef9f4f'];
const colorOf = (key, idx) => COLOR_HEX[key] || PALETTE[idx % PALETTE.length];

// Must stay behaviourally identical to NormModel in collect.ps1 and norm_model() in
// collect-ccswitch.py. Lowercasing first is what makes PS's case-insensitive -replace and
// JS's case-sensitive replace agree; [0-9] not \d because PS \d also matches Unicode digits.
const MODEL_DATE_RE = /(-[a-z]{1,4})?-[0-9]{4,8}$/i;
function normModel(s){
  let t = String(s == null ? '' : s).trim().toLowerCase();
  if (!t || t === '<synthetic>') return 'unknown';
  const i = t.lastIndexOf('/'); if (i >= 0) t = t.slice(i + 1);
  t = t.replace(MODEL_DATE_RE, '');
  t = t.replace(/[-_.]+$/, '');
  return (!t || t === '<synthetic>') ? 'unknown' : t;
}
// 其他 makes it exactly PALETTE.length segments, so no model shares a colour
const MODEL_TOPN = PALETTE.length - 1;
// Selector alias -> product name, supplied by server.py from ~/.qoder*/.auth/dynamic-texts.json.
// Display-only: the aggregation key stays the alias, so swapping bundles needs no rescan.
function modelName(alias){
  const m = (DATA && DATA.modelNames) || {};
  const v = m[alias];
  return v && v !== alias ? v : alias;
}
const fmtN = n => n >= 1e9 ? (n/1e9).toFixed(2)+'B'
               : n >= 1e6 ? (n/1e6).toFixed(1)+'M'
               : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : String(n);

const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let DATA = null;
let GRAN = 'day';
let DIM  = 'src';       // 'src' = one series per source, 'model' = one series per model
let APP = 'all';        // app tab filter: 'all' | app family
let FROM = '';          // '' = default (last 30 days of data)
let TO   = '';
let AUTO = 30000;       // auto refresh ms; 0 = off
let autoTimer = null;

async function load(force) {
  const st = document.getElementById('status');
  st.textContent = '加载中…';
  try {
    const res = await fetch('/api/usage' + (force ? '?refresh=1' : ''));
    const d = await res.json();
    if (res.status === 202) { setTimeout(()=>load(false), 3000); return; }
    DATA = d;
    buildTabs();
    render();
    st.textContent = d.scanning ? '后台重扫中，显示缓存结果' : '更新于 ' + (d.generatedAt||'');
    // a collector that crashed returns no roots at all -- say so instead of showing fewer tabs
    if ((d.collectorErrors||[]).length) st.textContent += '  ⚠ 采集失败: ' + d.collectorErrors.join('; ');
  } catch (e) { st.textContent = '加载失败: ' + e; }
}

// ---- date helpers (UTC day strings) ----
const pad2 = n => String(n).padStart(2,'0');
function dstr(dt){ return dt.getUTCFullYear()+'-'+pad2(dt.getUTCMonth()+1)+'-'+pad2(dt.getUTCDate()); }
function parseD(s){ const p=s.split('-'); return new Date(Date.UTC(+p[0], +p[1]-1, +p[2])); }
function addDays(s,n){ const d=parseD(s); d.setUTCDate(d.getUTCDate()+n); return dstr(d); }
function diffDays(a,b){ return Math.round((parseD(b)-parseD(a))/864e5); }
function* eachDay(from,to){ let s=from; while(s<=to){ yield s; s=addDays(s,1); } }

// ---- app family grouping for tabs ----
function appOf(r){
  const l = r.label;
  // SQLite roots carry Chinese/short labels, so key on the stable id instead of the label
  if (r.key === 'qoder-ide') return 'Qoder 桌面端';
  if (r.key === 'zcode') return 'ZCode';
  if (/claude/i.test(l)) return 'Claude Code';
  if (/codex/i.test(l))  return 'Codex';
  if (/gemini/i.test(l)) return 'Gemini';
  if (/opencode/i.test(l)) return 'OpenCode';
  if (/workbuddy/i.test(l)) return 'WorkBuddy';
  if (/codebuddy/i.test(l)) return 'CodeBuddy';
  if (/reasonix/i.test(l)) return 'Reasonix';
  if (/cline/i.test(l)) return 'Cline';
  return 'Qoder CLI';
}
function roots(){ return DATA ? (DATA.roots||[]) : []; }

// Merge every visible source's per-day byModel map into one pseudo-root per model, so the
// existing cards / stacked chart / legend / table render the model dimension unchanged.
function buildModelRoots(src, rng){
  const acc = {};
  src.forEach(r => (r.days||[]).forEach(d => {
    if (d.day < rng[0] || d.day > rng[1]) return;
    const bm = d.byModel;
    // a cache.json written by an older collector has no byModel; a truncated one may hold a
    // string here, and Object.entries() on a string would yield one "model" per character
    if (!bm || typeof bm !== 'object') return;
    Object.keys(bm).forEach(raw => {
      const v = bm[raw] || {};
      const alias = normModel(raw);
      // Bucket on the product name, not the alias: cc-switch records `glm-5.3-flash` while
      // the Qoder transcript records `gfmodel` for the same model, and keeping them apart
      // splits one model across two rows (and two Top-7 slots).
      const disp = modelName(alias);
      const model = normModel(disp);
      const a = acc[model] || (acc[model] = {req:0,in:0,out:0,cost:0,costSeen:false,days:{},reals:{},aliases:{},disp:''});
      a.aliases[alias] = true;
      if (disp !== alias && !a.disp) a.disp = disp;
      const t = a.days[d.day] || (a.days[d.day] = {req:0,in:0,out:0,cost:0,costSeen:false});
      t.req += v.requests||0; t.in += v.inTokens||0; t.out += v.outTokens||0;
      a.req += v.requests||0; a.in += v.inTokens||0; a.out += v.outTokens||0;
      // accumulate on both the day and the model: the legend/card reads the model total, and
      // forgetting it here silently paints "$0" because costSeen is still set
      if (typeof v.costUsd === 'number') {
        t.cost += v.costUsd; t.costSeen = true;
        a.cost += v.costUsd; a.costSeen = true;
      }
      a.reals[r.real === true ? 'real' : 'est'] = true;
    });
  }));
  const list = Object.keys(acc).map(k => ({model:k, a:acc[k]}));
  // explicit key tie-break: rootsFiltered() runs several times per render and the table,
  // legend and chart must agree on which model is the 7th
  list.sort((x,y) => (y.a.in - x.a.in) || (x.model < y.model ? -1 : x.model > y.model ? 1 : 0));
  const keep = list.slice(0, MODEL_TOPN), rest = list.slice(MODEL_TOPN);
  if (rest.length) {
    const m = {req:0,in:0,out:0,cost:0,costSeen:false,days:{},reals:{},aliases:{},disp:''};
    rest.forEach(x => {
      const a = x.a;
      m.req += a.req; m.in += a.in; m.out += a.out; m.cost += a.cost;
      if (a.costSeen) m.costSeen = true;
      if (a.reals.real) m.reals.real = true;
      if (a.reals.est)  m.reals.est = true;
      Object.keys(a.aliases || {}).forEach(k => m.aliases[k] = true);
      Object.keys(a.days).forEach(day => {
        const t = m.days[day] || (m.days[day] = {req:0,in:0,out:0,cost:0,costSeen:false});
        const s = a.days[day];
        t.req += s.req; t.in += s.in; t.out += s.out;
        if (s.costSeen) { t.cost += s.cost; t.costSeen = true; }
      });
    });
    keep.push({model:'其他', a:m});
  }
  const r2 = v => Math.round(v*100)/100;
  return keep.map(x => ({
    key: 'm:' + x.model, label: x.a.disp || x.model,
    alias: Object.keys(x.a.aliases || {}).sort().join(' '),
    kind: x.a.reals.real && x.a.reals.est ? '混合' : (x.a.reals.real ? '真实值' : '估算'),
    real: !!x.a.reals.real && !x.a.reals.est,
    sessions: null,
    costUsd: x.a.costSeen ? r2(x.a.cost) : null,   // null, not 0, so the legend hides the $
    days: Object.keys(x.a.days).sort().map(day => {
      const s = x.a.days[day];
      const o = {day, requests:s.req, inTokens:s.in, outTokens:s.out};
      if (s.costSeen) o.costUsd = r2(s.cost);
      return o;
    })
  }));
}

// Memoised on purpose: render() -> buckets() -> dayMap() -> rootsFiltered() is called at
// least three times per paint, and an un-memoised top-N can pick a different 7th model on
// each pass when two models tie, making the chart contradict the table.
let _vrKey = '', _vr = null;
function rootsFiltered(){
  const rs = roots();
  const src = APP === 'all' ? rs : rs.filter(r => appOf(r) === APP);
  if (DIM !== 'model') return src;
  const rng = effRange() || ['-','-'];
  const k = APP + '|' + rng[0] + '|' + rng[1] + '|' + (DATA && DATA.generatedAt);
  if (_vrKey !== k) { _vr = buildModelRoots(src, rng); _vrKey = k; }
  return _vr;
}

function dataSpan(){
  const days = [];
  roots().forEach(r => (r.days||[]).forEach(d => days.push(d.day)));
  if (!days.length) return null;
  days.sort();
  return [days[0], days[days.length-1]];
}
// effective FROM/TO with default = last 30 days of data
function effRange(){
  const sp = dataSpan(); if (!sp) return null;
  let to = TO || sp[1];
  let from = FROM || addDays(to, -29);   // 30 days inclusive
  if (from < sp[0]) from = sp[0];
  if (to < from) to = from;
  return [from, to];
}

// ---- zero-filled per-day map (only filtered roots) ----
function dayMap(){
  const rng = effRange(); if (!rng) return {};
  const rs = rootsFiltered();
  const map = {};
  rs.forEach(r => (r.days||[]).forEach(x => {
    if (x.day < rng[0] || x.day > rng[1]) return;
    const m = map[x.day] = map[x.day] || {day:x.day};
    m[r.key+'Req'] = (m[r.key+'Req']||0) + x.requests;
    m[r.key+'In']  = (m[r.key+'In']||0)  + x.inTokens;
  }));
  const full = {};
  for (const d of eachDay(rng[0], rng[1])) {
    const m = full[d] = map[d] || {day:d};
    rs.forEach(r => { m[r.key+'Req'] = m[r.key+'Req']||0; m[r.key+'In'] = m[r.key+'In']||0; });
  }
  return full;
}

function buildTabs(){
  const fams = [];
  roots().forEach(r => { const a = appOf(r); if (!fams.includes(a)) fams.push(a); });
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  ['all'].concat(fams).forEach(a => {
    const b = document.createElement('button');
    b.textContent = a === 'all' ? '全部' : a;
    b.className = a === APP ? 'active' : '';
    b.onclick = () => { APP = a; buildTabs(); render(); };
    el.appendChild(b);
  });
}

function buckets(){
  const m = dayMap();
  const rs = rootsFiltered();
  const bmap = {};
  for (const d of Object.keys(m)) {
    let k, label;
    if (GRAN === 'day')      { k = d; label = d; }
    else if (GRAN === 'week'){ const ws = weekStart(d); k = ws; label = ws + ' 起'; }
    else                     { k = d.slice(0,7); label = d.slice(0,7); }
    const b = bmap[k] = bmap[k] || {key:k, label, days:0, nodata:0};
    rs.forEach(r => {
      b[r.key+'Req'] = (b[r.key+'Req']||0) + (m[d][r.key+'Req']||0);
      b[r.key+'In']  = (b[r.key+'In']||0)  + (m[d][r.key+'In']||0);
    });
    b.days++;
    if (!rs.reduce((s,r)=>s+(m[d][r.key+'Req']||0),0)) b.nodata++;
  }
  return Object.values(bmap).sort((a,b)=>a.key<b.key?-1:1);
}
function weekStart(s){ const d=parseD(s); const dow=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-dow); return dstr(d); }

const card = (k,v,s,color) => '<div class="card"><div class="k">'+k+'</div><div class="v"'+
  (color ? ' style="color:'+color+'"' : '')+'>'+v+'</div><div class="s">'+s+'</div></div>';

function render(){
  if (!DATA) return;
  const rs = rootsFiltered();
  const rng = effRange() || ['-','-'];
  const rows = buckets();

  // range label: YYYY/M/d 00:00:00 - YYYY/M/d 23:59:59
  const fmtLbl = s => { const p = s.split('-'); return p[0]+'/'+ (+p[1]) +'/'+ (+p[2]); };
  document.getElementById('rangeLabel').textContent =
    fmtLbl(rng[0]) + ' 00:00:00 - ' + fmtLbl(rng[1]) + ' 23:59:59';

  const kindTag = r => r.kind || (r.real ? '真实值' : '估算');
  if (DIM === 'model' && !rs.length) {
    // Two different empties: the cache predates byModel (a rescan fixes it), versus the
    // range/tab simply having no model-tagged rows (a rescan would fix nothing).
    const hasAny = roots().some(r => (r.days||[]).some(d => d.byModel && typeof d.byModel === 'object'));
    const why = hasAny
      ? '当前时间区间和标签页内没有带模型标记的用量记录，放宽日期范围或切到「全部」试试。'
      : '当前缓存里没有模型维度数据，点右上角「⟳ 刷新」重新扫描。';
    document.getElementById('cards').innerHTML = '<div class="card"><div class="k">按模型暂不可用</div>' +
      '<div class="s">' + why + '</div></div>';
    document.getElementById('legend').innerHTML = '';
    document.getElementById('chart').innerHTML = '';
    hideTip();
    document.getElementById('tbl').innerHTML = '';
    document.getElementById('chartTitle').textContent = '输入 token';
    return;
  }

  // legend
  const aliasTag = r => (r.alias && r.alias !== r.label)
    ? '<span style="opacity:.45;font-size:11px"> '+r.alias+'</span>' : '';
  document.getElementById('legend').innerHTML = rs.map((r,i) =>
    '<span><span class="dot" style="background:'+colorOf(r.key,i)+'"></span>'+r.label+aliasTag(r)+
    '<span class="tag">'+(kindTag(r))+(r.costUsd!=null?' $'+r.costUsd:'')+'</span></span>').join('');

  // cards: range totals per root + grand total
  const sum = (arr,f) => arr.reduce((a,x)=>a+(x[f]||0),0);
  const cards = rs.map((r,i) => {
    const all = r.days||[];
    const inR = all.filter(d=>d.day>=rng[0]&&d.day<=rng[1]);
    const inT = sum(inR,'inTokens'), outT = sum(inR,'outTokens'), req = sum(inR,'requests');
    // Qoder 桌面端 / WorkBuddy stop producing records months ago, so their tab would
    // otherwise read as a flat zero and look broken rather than simply out of range
    const last = all.reduce((m,d)=>d.day>m?d.day:m, '');
    const away = (all.length && !inR.length) ? ' · 记录在所选区间外，最新 '+last : '';
    return card(r.label+' 输入', fmtN(inT),
      '输出 '+fmtN(outT)+' · 请求 '+fmtN(req)+' · '+kindTag(r)+away+
      (r.alias && r.alias !== r.label ? ' · 转录键 '+r.alias : ''), colorOf(r.key,i));
  });
  const tot = rs.reduce((s,r)=>{
    (r.days||[]).filter(d=>d.day>=rng[0]&&d.day<=rng[1]).forEach(d=>{ s.in+=d.inTokens; s.out+=d.outTokens; s.req+=d.requests; });
    return s;
  }, {in:0,out:0,req:0});
  cards.push(card('合计输入', fmtN(tot.in), '合计输出 '+fmtN(tot.out)+' · 请求 '+fmtN(tot.req), ''));
  document.getElementById('cards').innerHTML = cards.join('');

  document.getElementById('chartTitle').textContent =
    ({day:'每日',week:'每周（周一起）',month:'每月'})[GRAN] + '输入 token（'+fmtLbl(rng[0])+' ~ '+fmtLbl(rng[1])+'）';
  drawChart(rows, rs);

  const z = v => v ? fmtN(v) : '—';
  const gLabel = {day:'日期(UTC)', week:'周（周一）', month:'月'}[GRAN];
  // several aliases share one product name (qmodel & dashscope_qmodel → Qwen3.7-Plus), so
  // only the colliding columns carry the alias
  const dupLbl = {};
  rs.forEach(r => dupLbl[r.label] = (dupLbl[r.label]||0) + 1);
  const colLbl = r => (r.alias && dupLbl[r.label] > 1) ? r.label + '(' + r.alias + ')' : r.label;
  let html = '<tr><th>'+gLabel+'</th>' + rs.map(r => '<th>'+colLbl(r)+'请求</th><th>'+colLbl(r)+'输入</th>').join('') +
      '<th>合计输入</th><th>无数据</th></tr>';
  rows.forEach(r => {
    let tot2 = 0, anyReq = 0;
    const cells = rs.map(x => {
      tot2 += r[x.key+'In']||0; anyReq += r[x.key+'Req']||0;
      return '<td>'+z(r[x.key+'Req'])+'</td><td>'+z(r[x.key+'In'])+'</td>';
    }).join('');
    html += '<tr'+(anyReq===0?' class="nodata"':'')+'><td>'+r.label+'</td>'+cells+
            '<td>'+z(tot2)+'</td><td>'+(anyReq===0?'是':'')+'</td></tr>';
  });
  document.getElementById('tbl').innerHTML = html;

  const fnItems = [
    'Qoder CLI 本地 usage 为 0，其数据为字符估算（内置 200K / BYOK ' + (DATA.customWindowK || 300) + 'K 窗口，≈0.32 token/字符）。',
    'Claude Code / CodeBuddy / WorkBuddy / Cline / Reasonix：转录含真实 usage。',
    'ZCode：取 ~/.zcode/cli/db/db.sqlite 的 model_usage 表（不含划词 side-chat）。',
    'Qoder 桌面端：取 %APPDATA%/Qoder 的 chat_message。',
    'cc-switch：汇总来自 ~/.cc-switch/cc-switch.db（含 USD 成本），与本地转录重叠日期已去重。',
    'Trae / Trae CN / TRAE SOLO CN 不在看板里：会话与 token 全在 SQLCipher 加密库，'
      + '明文存储（Local Storage / IndexedDB / state.vscdb）里一条消息都没有，无文本可估。',
  ];
  if (DIM === 'model') fnItems.push(
    '按模型：模型名取自各转录的 model 字段，已去掉 provider 前缀与日期后缀（deepseek-v4-flash-0731 → deepseek-v4-flash）。',
    'Qoder 内置模型在转录里只记选择器别名，产品名由 ~/.qoder*/.auth/dynamic-texts.json 映射（qfmodel → Qwen3.8-Flash），别名以浅色标在旁边。',
    'efficient / lite / ultimate / auto 是档位不是某个模型，还原不出具体型号。',
    '缺失或 <synthetic> 归入 unknown；柱图只列输入 token 前 ' + MODEL_TOPN + ' 名，其余并入「其他」。',
    '成本仅 cc-switch 覆盖的模型有真实 USD，其它来源不估价。',
  );
  document.getElementById('footnote').innerHTML =
    '<ul>' + fnItems.map(s => '<li>' + esc(s) + '</li>').join('') + '</ul>';
}

const tipEl = document.getElementById('tip');
let tipOn = -1;      // column index the tooltip/highlight currently belongs to
let TIPCOLS = [];    // one tooltip HTML per column, rebuilt on every chart paint

function drawChart(rows, rs){
  const W = 1300, H = 360, padL = 58, padB = 48, padT = 12, padR = 12;
  const iw = W - padL - padR, ih = H - padT - padB;
  const max = Math.max.apply(null, rows.map(r => rs.reduce((s,x)=>s+(r[x.key+'In']||0),0)).concat([1]));
  // The old fixed 1e8 quantum flattened the model view, where one model's daily peak can be
  // 1e6 and would render as a 1%-tall bar. Scale the step to the data instead.
  const rawStep = (max || 1) / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const yMax = Math.ceil(rawStep / mag) * mag * 4;
  const slot = iw / rows.length, bw = Math.min(slot * 0.72, 40), gap = slot - bw;
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const y = padT + ih - ih * i / 4;
    g += '<line class="grid" x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'"/>';
    g += '<text x="'+(padL-6)+'" y="'+(y+3)+'" text-anchor="end">'+fmtN(yMax*i/4)+'</text>';
  }
  const tickEvery = Math.max(1, Math.ceil(rows.length/26));
  const tips = [];
  rows.forEach((r, i) => {
    const x = padL + slot*i + gap/2;
    const total = rs.reduce((s,rr)=>s+(r[rr.key+'In']||0),0);
    const totalReq = rs.reduce((s,rr)=>s+(r[rr.key+'Req']||0),0);
    if (total === 0) {
      g += '<line class="stub" x1="'+x+'" y1="'+(padT+ih)+'" x2="'+(x+bw)+'" y2="'+(padT+ih)+'"/>';
    } else {
      let acc = 0, ci = 0;
      rs.forEach(rr => {
        const v = r[rr.key+'In']||0;
        if (v <= 0) { ci++; return; }
        const h = ih * v / yMax;
        const yTop = padT + ih - ih * (acc + v) / yMax;
        g += '<rect class="seg" x="'+x+'" y="'+yTop+'" width="'+bw+'" height="'+h+'" fill="'+colorOf(rr.key,ci++)+'" rx="1"/>';
        acc += v;
      });
    }
    // hover band spans the whole plot height, so a 2px bar is as easy to hit as a tall one
    g += '<rect class="hit" data-i="'+i+'" x="'+x+'" y="'+padT+'" width="'+bw+'" height="'+ih+'"/>';
    const items = rs.map((rr, j) => ({label:rr.label, color:colorOf(rr.key, j), v:r[rr.key+'In']||0}))
                    .filter(o => o.v > 0).sort((a,b) => b.v - a.v);
    tips.push('<div class="h">'+esc(r.label)+'</div>' + (items.length
      ? items.map(o => '<div class="r"><span class="dot" style="background:'+o.color+'"></span>'+
                       '<span class="n">'+esc(o.label)+'</span><span class="q">'+fmtN(o.v)+'</span></div>').join('') +
        '<div class="s"><span>合计 '+fmtN(total)+'</span><span>请求 '+fmtN(totalReq)+'</span></div>'
      : '<div class="r e">无数据</div>'));
    if (i % tickEvery === 0)
      g += '<text x="'+(x+bw/2)+'" y="'+(H-padB+14)+'" text-anchor="middle">'+(GRAN==='day'? r.key.slice(5) : r.label)+'</text>';
  });
  TIPCOLS = tips;
  document.getElementById('chart').innerHTML =
    '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+g+'</svg>';
  hideTip();
}

function hideTip(){
  tipEl.hidden = true;
  tipOn = -1;
  const on = document.querySelector('#chart .hit.on');
  if (on) on.classList.remove('on');
}

function showTip(i, ev){
  if (i !== tipOn) {
    if (!TIPCOLS[i]) { hideTip(); return; }
    tipEl.innerHTML = TIPCOLS[i];
    const prev = document.querySelector('#chart .hit.on');
    if (prev) prev.classList.remove('on');
    const hit = document.querySelector('#chart .hit[data-i="'+i+'"]');
    if (hit) hit.classList.add('on');
    tipEl.hidden = false;
    tipOn = i;
  }
  const box = tipEl.getBoundingClientRect();
  let x = ev.clientX + 16, y = ev.clientY + 16;
  if (x + box.width > innerWidth - 8) x = Math.max(8, ev.clientX - box.width - 16);
  if (y + box.height > innerHeight - 8) y = Math.max(8, ev.clientY - box.height - 16);
  tipEl.style.left = x + 'px';
  tipEl.style.top  = y + 'px';
}


// ---- date range picker ----
const DOW = ['日','一','二','三','四','五','六'];
const PRESETS = [['当天',0],['1d',1],['7d',7],['14d',14],['30d',30]];
let pStart = '', pEnd = '';
let calY = 0, calM = 0;
let calFirst = null;

function placePicker(){
  const p = document.getElementById('picker');
  const r = document.getElementById('rangeBtn').getBoundingClientRect();
  p.style.top = (r.bottom + 8) + 'px';
  p.style.left = Math.max(12, Math.min(r.right - p.offsetWidth, window.innerWidth - p.offsetWidth - 12)) + 'px';
}
function openPicker(){
  const sp = dataSpan(); if (!sp) return;
  const rng = effRange();
  pStart = rng[0]; pEnd = rng[1];
  const d = parseD(pEnd);
  calY = d.getUTCFullYear(); calM = d.getUTCMonth();
  document.getElementById('startIn').value = pStart;
  document.getElementById('endIn').value = pEnd;
  document.getElementById('calDow').innerHTML = DOW.map(x=>'<div class="dow">'+x+'</div>').join('');
  document.getElementById('picker').hidden = false;
  placePicker();
  drawCal();
}
function closePicker(){ document.getElementById('picker').hidden = true; }

function setRange(a, b){
  if (!a || !b) return;
  if (a > b) { const t = a; a = b; b = t; }
  pStart = a; pEnd = b;
  document.getElementById('startIn').value = a;
  document.getElementById('endIn').value = b;
  document.querySelectorAll('#presets button').forEach((btn, i) => {
    const n = PRESETS[i][1];
    btn.classList.toggle('active', pStart === addDays(pEnd, -(n>0?n-1:0)));
  });
}

function drawCal(){
  document.getElementById('calTitle').textContent = calY + '年' + (calM+1) + '月';
  const body = document.getElementById('calBody');
  body.innerHTML = '';
  const startDow = new Date(Date.UTC(calY, calM, 1)).getUTCDay();
  const prevDays = new Date(Date.UTC(calY, calM, 0)).getUTCDate();
  const cells = [];
  for (let i = startDow - 1; i >= 0; i--) cells.push(dstr(new Date(Date.UTC(calY, calM-1, prevDays-i))));
  const daysIn = new Date(Date.UTC(calY, calM+1, 0)).getUTCDate();
  for (let i = 1; i <= daysIn; i++) cells.push(dstr(new Date(Date.UTC(calY, calM, i))));
  while (cells.length % 7) cells.push('');
  const sp = dataSpan() || ['0','9'];
  cells.forEach(d => {
    const el = document.createElement('div');
    const inMonth = d && d.slice(0,7) === calY+'-'+pad2(calM+1);
    const clickable = d && inMonth && d >= sp[0] && d <= sp[1];
    el.className = 'calday' + (d && !inMonth ? ' dim' : '') +
      (d === pStart || d === pEnd ? ' sel' : (d && d > pStart && d < pEnd ? ' inrange' : '')) +
      (inMonth && !clickable && d ? ' future' : '');
    if (d) el.textContent = +d.split('-')[2];
    if (clickable) el.onclick = () => {
      if (calFirst === null) { setRange(d, d); calFirst = d; }
      else { setRange(calFirst, d); calFirst = null; }
      drawCal();
    };
    body.appendChild(el);
  });
  // rebuild presets active state
  document.querySelectorAll('#presets button').forEach((btn, i) => {
    const n = PRESETS[i][1];
    btn.classList.toggle('active', pStart === addDays(pEnd, -(n>0?n-1:0)));
  });
}

// ---- events ----
// Delegated: the hit bands are rebuilt on every repaint, so no per-element listeners.
document.getElementById('chart').addEventListener('mousemove', e => {
  const hit = e.target.closest ? e.target.closest('.hit') : null;
  if (hit) showTip(+hit.dataset.i, e); else hideTip();
});
document.getElementById('chart').addEventListener('mouseleave', hideTip);
document.getElementById('themeBtn').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('au-theme', next); } catch (e) {}
  themeIcon();
});
function themeIcon(){
  document.getElementById('themeBtn').textContent =
    document.documentElement.dataset.theme === 'light' ? '🌙 暗色' : '☀ 亮色';
}
themeIcon();
document.getElementById('gran').addEventListener('click', e => {
  if (e.target.dataset.g) {
    GRAN = e.target.dataset.g;
    document.querySelectorAll('#gran button').forEach(b => b.classList.toggle('active', b === e.target));
    render();
  }
});
document.getElementById('dim').addEventListener('click', e => {
  if (e.target.dataset.d) {
    DIM = e.target.dataset.d;
    document.querySelectorAll('#dim button').forEach(b => b.classList.toggle('active', b === e.target));
    render();
  }
});
document.getElementById('rangeBtn').addEventListener('click', () => {
  const p = document.getElementById('picker');
  if (p.hidden) { calFirst = null; openPicker(); } else closePicker();
});
// the topbar wraps, so a resize moves the button out from under an open picker
window.addEventListener('resize', () => { if (!document.getElementById('picker').hidden) placePicker(); });
document.getElementById('cancelBtn').addEventListener('click', closePicker);
document.getElementById('okBtn').addEventListener('click', () => {
  FROM = document.getElementById('startIn').value;
  TO   = document.getElementById('endIn').value;
  closePicker(); render();
});
document.getElementById('startIn').addEventListener('change', e => { setRange(e.target.value, pEnd); drawCal(); });
document.getElementById('endIn').addEventListener('change', e => { setRange(pStart, e.target.value); drawCal(); });
document.getElementById('prevM').addEventListener('click', () => { calM--; if (calM<0){calM=11;calY--;} drawCal(); });
document.getElementById('nextM').addEventListener('click', () => { calM++; if (calM>11){calM=0;calY++;} drawCal(); });
document.getElementById('refreshBtn').addEventListener('click', () => load(true));
document.getElementById('autoBtn').addEventListener('click', () => {
  AUTO = AUTO === 30000 ? 0 : 30000;
  document.getElementById('autoLabel').textContent = AUTO ? '30s' : '关';
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  if (AUTO) autoTimer = setInterval(() => load(false), AUTO);
});
// presets (create once)
(function(){
  const pe = document.getElementById('presets');
  PRESETS.forEach(([label, n]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => { setRange(addDays(pEnd, -(n>0?n-1:0)), pEnd); drawCal(); };
    pe.appendChild(b);
  });
})();
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });
autoTimer = setInterval(() => load(false), AUTO);
load(false);
</script>
